---
- name: Installer Nginx
  ansible.builtin.apt:
    name: "{{ nginx_packages }}"
    state: present
  register: nginx_pkg_result
  retries: 3
  delay: 5
  until: nginx_pkg_result is succeeded

- name: Créer le répertoire web
  ansible.builtin.file:
    path: "{{ nginx_web_root }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"

- name: Déployer le virtualhost Nginx
  ansible.builtin.template:
    src: app.conf.j2
    dest: "/etc/nginx/sites-available/{{ nginx_app_name }}.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Activer le virtualhost
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ nginx_app_name }}.conf"
    dest: "/etc/nginx/sites-enabled/{{ nginx_app_name }}.conf"
    state: link
  notify: Reload nginx

- name: Supprimer le site par défaut
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Déployer la page statique
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ nginx_web_root }}/{{ nginx_index_file }}"
    owner: www-data
    group: www-data
    mode: "0644"
  when: nginx_deploy_static_page | bool

- name: Valider la configuration Nginx
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false

- name: Activer et démarrer Nginx
  ansible.builtin.service:
    name: "{{ nginx_service }}"
    state: started
    enabled: true

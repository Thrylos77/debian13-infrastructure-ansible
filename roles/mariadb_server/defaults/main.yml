---
mariadb_packages:
  - mariadb-server
  - mariadb-client
  - python3-pymysql

mariadb_service: mariadb
mariadb_bind_address: 127.0.0.1
mariadb_port: 3306
mariadb_datadir: /var/lib/mysql
mariadb_socket: /run/mysqld/mysqld.sock
mariadb_config_file: /etc/mysql/mariadb.conf.d/99-ansible.cnf

mariadb_remove_anonymous_users: true
mariadb_remove_test_db: true

mariadb_databases: []
mariadb_users: []

mariadb_backup_dir: /var/backups/mysql
